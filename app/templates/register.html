{% extends "base.html" %}

{% block title %}Register – CampusFix{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
            <div class="card card-custom p-4 p-sm-5 border-0 shadow-lg">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-3 text-white p-2 mb-3" style="width: 44px; height: 44px;">
                        <i data-lucide="user-plus" style="width: 22px; height: 22px;"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Join CampusFix as a student to report issues</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i data-lucide="user" style="width: 16px; height: 16px;"></i>
                            </span>
                            <input 
                                type="text" 
                                class="form-control border-start-0" 
                                id="name" 
                                name="name" 
                                placeholder="e.g. Alex Morgan" 
                                value="{{ name or '' }}" 
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Campus Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i data-lucide="mail" style="width: 16px; height: 16px;"></i>
                            </span>
                            <input 
                                type="email" 
                                class="form-control border-start-0" 
                                id="email" 
                                name="email" 
                                placeholder="name@campus.edu" 
                                value="{{ email or '' }}" 
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
                            </span>
                            <input 
                                type="password" 
                                class="form-control border-start-0" 
                                id="password" 
                                name="password" 
                                placeholder="Min. 6 characters" 
                                minlength="6"
                                required
                            >
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted">
                                <i data-lucide="check-check" style="width: 16px; height: 16px;"></i>
                            </span>
                            <input 
                                type="password" 
                                class="form-control border-start-0" 
                                id="confirm_password" 
                                name="confirm_password" 
                                placeholder="Re-enter password" 
                                minlength="6"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                        <span>Register Account</span>
                        <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <p class="small text-muted mb-0">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
