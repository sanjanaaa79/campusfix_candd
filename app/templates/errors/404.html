{% extends "base.html" %}

{% block title %}Page Not Found – 404 – CampusFix{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 mx-auto border-0 shadow-sm" style="max-width: 550px;">
        <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex mb-3 mx-auto">
            <i data-lucide="file-question" style="width: 48px; height: 48px;"></i>
        </div>
        <h1 class="fw-bold display-6">404 Not Found</h1>
        <p class="text-muted mb-4">
            The page or ticket you are looking for does not exist or may have been relocated.
        </p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-navy px-4">Back to CampusFix</a>
        </div>
    </div>
</div>
{% endblock %}
