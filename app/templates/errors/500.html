{% extends "base.html" %}

{% block title %}Internal Server Error – 500 – CampusFix{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card card-custom p-5 mx-auto border-0 shadow-sm" style="max-width: 550px;">
        <div class="p-3 bg-warning bg-opacity-10 text-warning rounded-circle d-inline-flex mb-3 mx-auto">
            <i data-lucide="server-crash" style="width: 48px; height: 48px;"></i>
        </div>
        <h1 class="fw-bold display-6">500 Server Error</h1>
        <p class="text-muted mb-4">
            An unexpected error occurred while processing your request. Please try again shortly or contact support.
        </p>
        <div>
            <a href="{{ url_for('index') }}" class="btn btn-navy px-4">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
